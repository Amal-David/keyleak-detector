services:
  keyleak-detector:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: keyleak-detector
    ports:
      - "127.0.0.1:5002:5002"
    environment:
      - PORT=5002
      - PYTHONUNBUFFERED=1
      # Container listens on all interfaces (reachable via the port mapping);
      # the host default is loopback-only.
      - KEYLEAK_HOST=0.0.0.0
    volumes:
      # Mount logs directory (optional - for persistent logs)
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; response = requests.get('http://localhost:5002/healthz', timeout=5); response.raise_for_status()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Security options
    security_opt:
      - no-new-privileges:true
    # Resource limits (adjust as needed)
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
