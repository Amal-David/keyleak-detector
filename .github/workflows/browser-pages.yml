# Static browser build: pull requests receive no deployment/OIDC permissions.
# GitHub Pages needs Settings > Pages > Source: GitHub Actions once per repo.
name: Browser app and Pages

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Verify and build browser app
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22.22.3"
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Run browser core and publication tests
        run: |
          node --test web/tests/*.test.js
          python -m unittest discover -s web/tests -p 'test_*.py' -v
      - name: Install pinned browser test dependency
        run: |
          python -m pip install "playwright==1.63.0"
          python -m playwright install chromium --with-deps
      - name: Exercise the built app in Chromium
        run: python -m unittest tests.test_browser_app -v
      - name: Build static site
        run: python scripts/build_browser_app.py
      - name: Package Pages artifact
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist/browser
          retention-days: 1

  deploy:
    name: Publish to GitHub Pages
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: keyleak-github-pages
      cancel-in-progress: false
    steps:
      - name: Deploy tested artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
