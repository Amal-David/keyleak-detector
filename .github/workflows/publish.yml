# Automated PyPI publish and downloadable assets on GitHub Release.
#
# Uses PyPI **Trusted Publishing** (OIDC) — no API token is stored in the repo.
# One-time setup on PyPI (https://pypi.org/manage/project/keyleak-detector/settings/publishing/):
#   Add a trusted publisher →
#     Owner: Amal-David   Repository: keyleak-detector
#     Workflow: publish.yml   (leave Environment blank)
#
# To cut a release: bump the version in pyproject.toml + keyleak/__init__.py,
# update CHANGELOG.md, then publish a GitHub Release tagged `vX.Y.Z`. This
# workflow builds, verifies the package version equals the tag, and uploads.
# Extension ZIPs use extension/manifest.json's independent version. The ZIP,
# wheel, sdist and SHA256SUMS are attached to the same published GitHub Release.
# Chrome Web Store submission remains a separate publisher-account operation.
#
# Supply-chain hygiene (per CLAUDE.md): every `uses:` is SHA-pinned; this is a
# release-triggered workflow, separate from CI, and shares no secrets with it.
name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build release distributions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22.22.3"
      - name: Check extension runtime and packaging
        run: |
          python -m unittest tests.test_extension_packaging -v
          node --test extension/tests/*.test.js
      - name: Build sdist + wheel
        run: |
          python -m pip install "poetry==2.5.1"
          poetry check --lock
          poetry build
      - name: Verify package version matches the release tag
        run: |
          # Guards against the 0.5.4-vs-0.6.0 mismatch class: refuse to publish
          # if the built version doesn't equal the vX.Y.Z release tag.
          PKG_VER="$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")"
          TAG_VER="${GITHUB_REF_NAME#v}"
          echo "package=$PKG_VER tag=$TAG_VER"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::pyproject version ($PKG_VER) != release tag ($TAG_VER)"; exit 1
          fi
      - name: Build extension ZIP and release checksums
        run: python scripts/build_extension.py --include-python-distributions
      - name: Store release distributions
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: python-distributions
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
      - name: Store GitHub Release assets
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: github-release-assets
          path: |
            dist/keyleak-detector-extension-v*.zip
            dist/keyleak_detector-*.whl
            dist/keyleak_detector-*.tar.gz
            dist/SHA256SUMS
          if-no-files-found: error

  pypi-publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # OIDC is available only after all build code has finished
    steps:
      - name: Download release distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: python-distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0

  github-release-assets:
    name: Attach GitHub Release assets
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # No checkout, dependency installation or execution of packaged code in
      # this job. The only write credential belongs to the upload step.
      - name: Download GitHub Release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: github-release-assets
          path: release-assets/
      - name: Verify and attach assets
        working-directory: release-assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(keyleak_detector-*.whl)
          sdists=(keyleak_detector-*.tar.gz)
          extensions=(keyleak-detector-extension-v*.zip)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          test "${#extensions[@]}" -eq 1
          assets=("${extensions[0]}" "${wheels[0]}" "${sdists[0]}")
          for file in "${assets[@]}" SHA256SUMS; do
            [[ "$file" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]*$ ]]
            test -f "$file" && test ! -L "$file"
          done
          # Compare data, never interpret paths from the downloaded manifest.
          actual="$(sha256sum -- "${assets[@]}" | LC_ALL=C sort -k2)"
          declared="$(LC_ALL=C sort -k2 SHA256SUMS)"
          test "$actual" = "$declared"
          # Existing assets are deliberately preserved; no --clobber on reruns.
          gh release upload "$RELEASE_TAG" "${assets[@]}" SHA256SUMS --repo "$GITHUB_REPOSITORY"
