name: Installed package validation

on:
  push:
    branches: [chore/distribution-readiness]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.13"
      - name: Capture tracked source and build dependencies
        run: |
          mkdir -p packaging-evidence/wheels
          git archive --format=tar.gz HEAD > packaging-evidence/source.tar.gz
          python -m pip download --dest packaging-evidence/wheels 'poetry-core==2.4.0' 'build==1.4.0' 'tldextract==5.1.2' 'Flask[async]==3.1.3' 'PySocks==1.7.1'
      - name: Build distributions
        run: |
          python -m pip install --no-index --find-links packaging-evidence/wheels 'build==1.4.0' 'poetry-core==2.4.0'
          python -m build --no-isolation --outdir packaging-evidence/dist
      - name: Preserve packaging evidence
        if: always()
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: packaging-baseline
          path: packaging-evidence/
          if-no-files-found: error
          retention-days: 3
