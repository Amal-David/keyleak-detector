# KeyLeak CI — runs the test suites + launch-gate on every PR.
#
# Supply-chain hygiene (per CLAUDE.md): every `uses:` is pinned to a full commit
# SHA (tags are mutable); the workflow is `pull_request`-triggered (NOT
# pull_request_target); it uses no secrets, so no secret/OIDC scope is shared
# with any release workflow.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    name: Python tests + launch-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b # v5.3.0
        with:
          python-version: "3.12"
      - name: Install pinned Poetry
        run: |
          python -m pip install "poetry==2.5.1"
      - name: Validate and install locked dependencies
        run: |
          poetry check --lock
          poetry install --no-interaction
          poetry run python -m pip check
          poetry run python -m playwright install chromium --with-deps
      - name: Run tests (requires browser integration; no skips)
        run: |
          PYTHONPATH=. poetry run python - <<'PY'
          import sys
          import unittest

          suite = unittest.defaultTestLoader.discover("tests")
          result = unittest.TextTestRunner(verbosity=2).run(suite)
          if result.skipped:
              print("CI requires every test, including Chromium/CDP integration, to run.", file=sys.stderr)
          raise SystemExit(not result.wasSuccessful() or bool(result.skipped) or result.testsRun == 0)
          PY
      - name: Build package
        run: poetry build
      - name: Launch-gate self-scan
        run: |
          PYTHONPATH=. poetry run python -m keyleak.cli local . --launch-profile launch-gate --fail-on high

  extension:
    name: Extension tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "20"
      - name: Run extension test suite
        run: |
          cd extension && node --test
