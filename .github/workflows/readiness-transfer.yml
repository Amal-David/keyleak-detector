# Temporary staging helper, excluded from the final PR tree.
# Does not change refs, releases or workflows. Workflow edits use the connector.
name: Assemble readiness changes
on:
  push:
    branches: [chore/distribution-readiness]
    paths: [.github/workflows/readiness-transfer.yml]
permissions:
  contents: write
jobs:
  assemble:
    if: github.actor == 'Amal-David'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: d97d8c82f28fc924fafb63fb833d7ab5b3ec9025
          persist-credentials: false
      - name: Assemble exact tested source tree without changing branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import json
          import os
          from pathlib import Path
          import re
          import subprocess
          import urllib.request

          repo = 'Amal-David/keyleak-detector'
          base_tree = 'c5eb53d49063c9497f25d9303dcb8016f42b5589'
          expected_tree = '96fd0e2be29aa66dad6102fb009d68783dd02510'
          source_tree = '02d97cc7215e30567b62c47ffff36927efe05cbd'
          blobs = [
              'dcaf0b5e5adf4ee485b7f00a72786f9000ed05e6',
              '29fc3af909907da05b46cd6314543545a25817d7',
              'a60ccd595d66f4d036ea9b76687a306886854c59',
              '3208e903c8d0d13422c5394583a0b84be8172d49',
          ]
          def api(path, data=None):
              request = urllib.request.Request(
                  f'https://api.github.com/repos/{repo}/{path}',
                  data=None if data is None else json.dumps(data).encode(),
                  headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                           'Accept': 'application/vnd.github+json',
                           'Content-Type': 'application/json',
                           'X-GitHub-Api-Version': '2022-11-28'},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  return json.load(response)

          patch = b''.join(base64.b64decode(api('git/blobs/' + sha)['content']) for sha in blobs)
          assert hashlib.sha256(patch).hexdigest() == '9d6a9131b3af4b37424135021434d6bf3562fa45ddf86ddd33a83bc5edecb8e2'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          p = Path('CONTRIBUTING.md')
          old = ('Keep `fixtures/vulnerable-demo/` and its packaged copy under\n'
                 '`keyleak/data/demo/` identical; a regression test checks this. Both contain only\n'
                 'synthetic examples. See [distribution readiness](docs/DISTRIBUTION.md) for clean')
          new = ('The installed demo uses a minimal synthetic fixture under `keyleak/data/demo/`.\n'
                 'Keep it free of real credentials and live targets; regression tests check its\n'
                 'findings and redaction. See [distribution readiness](docs/DISTRIBUTION.md) for clean')
          content = p.read_text()
          assert content.count(old) == 1
          p.write_text(content.replace(old, new))
          paths = re.findall(r'^diff --git a/\S+ b/(\S+)$', patch.decode(), re.M)
          assert len(paths) == 20 and len(set(paths)) == 20
          subprocess.run(['git', 'add', '-f', '--', *paths], check=True)
          subprocess.run(['git', 'diff', '--cached', '--check'], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          assert tree == expected_tree, (tree, expected_tree)
          # GITHUB_TOKEN cannot modify workflows. Leave those two files to the
          # authenticated connector, and upload only the ordinary source tree.
          result = api('git/trees', {'base_tree': base_tree, 'tree': [
              {'path': path, 'mode': '100644', 'type': 'blob',
               'content': Path(path).read_text(encoding='utf-8')}
              for path in paths if not path.startswith('.github/workflows/')
          ]})
          assert result['sha'] == source_tree
          print('READY_SOURCE_TREE=' + result['sha'])
          print('Verified source files; no branch, release, package or workflow was published.')
          PY
