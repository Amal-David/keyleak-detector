name: 'KeyLeak Detector'
description: >
  Scan for exposed API keys, BaaS misconfigurations (Supabase RLS, Firebase rules),
  and secrets in your codebase and preview deployments. Supports local file scanning,
  browser-based scanning of live URLs, and BaaS active validation.
author: 'Amal David'
branding:
  icon: 'shield'
  color: 'green'
inputs:
  mode:
    description: 'Scan mode: local (files only), browser (live URL), or both.'
    required: false
    default: 'local'
  url:
    description: 'URL to scan in browser mode (e.g., preview deployment URL).'
    required: false
    default: ''
  baas-validate:
    description: 'Enable active BaaS validation probes (Supabase RLS, Firebase rules).'
    required: false
    default: 'false'
  fail-on:
    description: 'Severity threshold to fail the check (low|medium|high|critical).'
    required: false
    default: 'high'
  launch-profile:
    description: 'Launch profile (launch-gate|local-dev|bug-bounty|ci|full).'
    required: false
    default: 'ci'
  allowlist:
    description: 'Path to allowlist (.yaml or .txt).'
    required: false
    default: 'keyleak-allowlist.yaml'
  output-format:
    description: 'Output format: json, sarif, markdown, or html.'
    required: false
    default: 'json'
  python-version:
    description: 'Python version for the runner.'
    required: false
    default: '3.12'
outputs:
  verdict:
    description: 'Scan verdict: SAFE_TO_SHIP, REVIEW, or BLOCK_SHIP'
    value: ${{ steps.scan.outputs.verdict }}
  findings-count:
    description: 'Total number of findings across the requested scans'
    value: ${{ steps.scan.outputs.findings_count }}
  report-path:
    description: 'Path to the generated report file'
    value: ${{ steps.scan.outputs.report_path }}
runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@0b93645e9fea7318ecaed2b359559ac225c90a2b  # v5.3.0
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install KeyLeak
      shell: bash
      env:
        KL_MODE: ${{ inputs.mode }}
        KL_ACTION_PATH: ${{ github.action_path }}
      run: |
        python -I -m pip install --upgrade pip
        python -I -m pip install -e "$KL_ACTION_PATH"
        if [ "$KL_MODE" = "browser" ] || [ "$KL_MODE" = "both" ]; then
          python -I -m pip install playwright
          python -I -m playwright install chromium --with-deps
        fi

    - name: Run KeyLeak scan
      id: scan
      shell: bash
      env:
        GITHUB_TOKEN: ''
        # All user-controlled inputs flow through env vars — never interpolate
        # ${{ inputs.* }} directly into the shell (GitHub Actions script injection).
        KL_MODE: ${{ inputs.mode }}
        KL_URL: ${{ inputs.url }}
        KL_FORMAT: ${{ inputs.output-format }}
        KL_FAILON: ${{ inputs.fail-on }}
        KL_PROFILE: ${{ inputs.launch-profile }}
        KL_ALLOWLIST: ${{ inputs.allowlist }}
        KL_BAAS: ${{ inputs.baas-validate }}
      run: |
        set -euo pipefail

        invalid_input() {
          echo "::error::$1" >&2
          echo "verdict=BLOCK_SHIP" >> "$GITHUB_OUTPUT"
          exit 2
        }

        case "$KL_MODE" in
          local|browser|both) ;;
          *) invalid_input "mode must be local, browser, or both" ;;
        esac
        case "$KL_FORMAT" in
          json|sarif|markdown|html) ;;
          *) invalid_input "output-format must be json, sarif, markdown, or html" ;;
        esac
        case "$KL_FAILON" in
          low|medium|high|critical) ;;
          *) invalid_input "fail-on must be low, medium, high, or critical" ;;
        esac
        case "$KL_PROFILE" in
          launch-gate|local-dev|bug-bounty|ci|full) ;;
          *) invalid_input "launch-profile is not supported" ;;
        esac
        case "$KL_BAAS" in
          true|false) ;;
          *) invalid_input "baas-validate must be true or false" ;;
        esac
        if [ "$KL_MODE" = "browser" ] || [ "$KL_MODE" = "both" ]; then
          case "$KL_URL" in
            http://?*|https://?*) ;;
            *) invalid_input "browser and both modes require an HTTP(S) URL" ;;
          esac
        fi

        # Keep generated reports outside the untrusted checkout. mktemp and
        # owner-only permissions prevent pre-existing report symlinks from
        # redirecting writes or adding arbitrary workspace files to artifacts.
        umask 077
        REPORT_DIR=$(mktemp -d "${RUNNER_TEMP:-/tmp}/keyleak-reports.XXXXXXXXXX")
        VERDICT="SAFE_TO_SHIP"
        FINDINGS=""
        EXIT_CODE=0
        REPORT="$REPORT_DIR/keyleak-report.$KL_FORMAT"
        JSON_REPORTS=()

        # Keep every report for diagnosis, but never hide a failed scanner or
        # a blocking finding behind a successful output/metadata step.
        run_scan() {
          local scan_report="$1"
          shift
          if "$@" > "$scan_report"; then
            if [ ! -s "$scan_report" ]; then
              echo "::error::KeyLeak produced an empty report" >&2
              EXIT_CODE=1
              VERDICT="BLOCK_SHIP"
            fi
          else
            EXIT_CODE=$?
            VERDICT="BLOCK_SHIP"
            echo "::error::KeyLeak scan failed (exit $EXIT_CODE)" >&2
          fi
          JSON_REPORTS+=("$scan_report")
        }

        ALLOWLIST_ARGS=()
        if [ -n "$KL_ALLOWLIST" ] && [ -f "$KL_ALLOWLIST" ]; then
          ALLOWLIST_ARGS=(--allowlist "$KL_ALLOWLIST")
        fi

        # Local scan
        if [ "$KL_MODE" = "local" ] || [ "$KL_MODE" = "both" ]; then
          run_scan "$REPORT_DIR/keyleak-self-audit-report.json" \
            keyleak self-audit . "${ALLOWLIST_ARGS[@]}" \
            --json --fail-on "$KL_FAILON"

          run_scan "$REPORT_DIR/keyleak-report.json" keyleak local . \
            --launch-profile "$KL_PROFILE" \
            "${ALLOWLIST_ARGS[@]}" \
            --json \
            --fail-on "$KL_FAILON"
        fi

        # Browser scan
        if [ "$KL_MODE" = "browser" ] || [ "$KL_MODE" = "both" ]; then
          BAAS_ARGS=()
          if [ "$KL_BAAS" = "true" ]; then
            BAAS_ARGS=(--baas-validate)
          fi

          REPORT="$REPORT_DIR/keyleak-browser-report.$KL_FORMAT"
          run_scan "$REPORT_DIR/keyleak-browser-report.json" keyleak browser-scan "$KL_URL" \
            "${BAAS_ARGS[@]}" \
            "${ALLOWLIST_ARGS[@]}" \
            --json \
            --fail-on "$KL_FAILON"
        fi

        # Scan each stage once. Derive every output format and the action
        # metadata from the same JSON, independent of the fail-on threshold.
        # Isolated Python prevents target-checkout modules from being imported.
        if METADATA=$(python -I - "$KL_FORMAT" "${JSON_REPORTS[@]}" <<'PY'
        import json
        import sys
        from pathlib import Path

        from keyleak.models import ScanReport
        from keyleak.reporting import format_html, format_markdown, format_sarif

        output_format = sys.argv[1]
        formatters = {"html": format_html, "markdown": format_markdown, "sarif": format_sarif}
        verdicts = {"SAFE_TO_SHIP": 0, "REVIEW": 1, "BLOCK_SHIP": 2}
        findings = 0
        verdict = "SAFE_TO_SHIP"
        invalid = False
        for path in sys.argv[2:]:
            try:
                with open(path, encoding="utf-8") as report_file:
                    payload = json.load(report_file)
                count = payload["summary"]["total_findings"]
                status = payload["verdict"]["status"]
                if type(count) is not int or count < 0 or status not in verdicts:
                    raise ValueError("Invalid report metadata")
                if not isinstance(payload["findings"], list):
                    raise ValueError("Invalid report findings")
                report = ScanReport.from_dict(payload)
                if count != len(report.findings) or status != report.verdict["status"]:
                    raise ValueError("Report metadata disagrees with findings")
                findings += count
                if verdicts[status] > verdicts[verdict]:
                    verdict = status
                if output_format != "json":
                    rendered = formatters[output_format](report)
                    Path(path).with_suffix(f".{output_format}").write_text(rendered, encoding="utf-8")
            except (OSError, ValueError, KeyError, TypeError, AttributeError):
                print("::error::KeyLeak report is invalid or could not be rendered", file=sys.stderr)
                invalid = True
        if invalid:
            sys.exit(1)
        print(findings, verdict)
        PY
        ); then
          read -r FINDINGS REPORT_VERDICT <<< "$METADATA"
          if [ "$EXIT_CODE" -eq 0 ]; then
            VERDICT="$REPORT_VERDICT"
          fi
        else
          EXIT_CODE=1
          VERDICT="BLOCK_SHIP"
        fi

        # On a formatting/scan failure, the original JSON still provides the
        # diagnostic report. Upload only paths produced in this invocation.
        if [ ! -f "$REPORT" ]; then
          REPORT="${REPORT%.*}.json"
        fi

        echo "verdict=$VERDICT" >> "$GITHUB_OUTPUT"
        echo "report_path=$REPORT" >> "$GITHUB_OUTPUT"
        echo "findings_count=$FINDINGS" >> "$GITHUB_OUTPUT"
        {
          echo 'report_paths<<KEYLEAK_REPORT_PATHS'
          for json_report in "${JSON_REPORTS[@]}"; do
            printf '%s\n' "$json_report"
            formatted_report="${json_report%.json}.$KL_FORMAT"
            if [ "$KL_FORMAT" != "json" ] && [ -f "$formatted_report" ]; then
              printf '%s\n' "$formatted_report"
            fi
          done
          echo 'KEYLEAK_REPORT_PATHS'
        } >> "$GITHUB_OUTPUT"
        exit "$EXIT_CODE"

    - name: Upload report artifact
      if: always() && steps.scan.outputs.report_paths != ''
      uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08  # v4.6.0
      with:
        name: keyleak-report
        path: ${{ steps.scan.outputs.report_paths }}
        if-no-files-found: ignore
